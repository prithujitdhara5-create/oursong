<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Our Song ❤️</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      margin: 0;
      height: 100vh;
      background: linear-gradient(135deg, #ffd6e8, #ffeef5);
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Poppins', sans-serif;
    }
    .card {
      background: white;
      padding: 30px;
      border-radius: 20px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.1);
    }
    button {
      background: #ff5fa2;
      border: none;
      color: white;
      padding: 15px 25px;
      font-size: 16px;
      border-radius: 30px;
      cursor: pointer;
    }
    button:hover {
      background: #ff3f8b;
    }
  </style>
</head>

<body>

  <div class="card">
    <h2>Prithujit ❤️ Adrija</h2>
    <p>Tap to play our song 🎶</p>

   
    <audio id="music" src="song.mp3"></audio>

    <button onclick="toggleMusic()">Play / Pause</button>
  </div>

  <script>
    const music = document.getElementById("music");
    function toggleMusic() {
      if (music.paused) {
        music.play();
      } else {
        music.pause();
      }
    }
  </script>

</body>
</html>
