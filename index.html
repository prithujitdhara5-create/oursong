<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Our Forever Song ❤️</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap');

body {
  margin: 0;
  font-family: 'Poppins', sans-serif;
  height: 100vh;
  background: linear-gradient(180deg, #ffe5ec, #e0c3fc);
  display: flex;
  justify-content: center;
  align-items: center;
  overflow: hidden;
}

.card {
  background: white;
  width: 90%;
  max-width: 360px;
  padding: 30px 22px;
  border-radius: 30px;
  text-align: center;
  box-shadow: 0 20px 50px rgba(0,0,0,0.15);
  position: relative;
  z-index: 2;
}

h1 {
  font-size: 22px;
  color: #ff4d6d;
  margin-bottom: 6px;
}

.names {
  font-size: 16px;
  color: #6a4c93;
  margin-bottom: 12px;
}

.message {
  font-size: 14px;
  color: #555;
  margin-bottom: 25px;
}

.play-btn {
  width: 85px;
  height: 85px;
  background: linear-gradient(135deg, #ff4d6d, #ff758f);
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 32px;
  color: white;
  margin: 0 auto;
  cursor: pointer;
  box-shadow: 0 12px 25px rgba(255,77,109,0.45);
  transition: transform 0.2s ease;
}

.play-btn:active {
  transform: scale(0.92);
}

.date {
  margin-top: 18px;
  font-size: 12px;
  color: #999;
}

.footer {
  margin-top: 10px;
  font-size: 11px;
  color: #aaa;
}

/* Floating Hearts */
.heart {
  position: fixed;
  bottom: -20px;
  font-size: 20px;
  animation: floatUp linear forwards;
  opacity: 0.7;
}

@keyframes floatUp {
  from {
    transform: translateY(0);
    opacity: 0.8;
  }
  to {
    transform: translateY(-110vh);
    opacity: 0;
  }
}
</style>
</head>

<body>

<div class="card">
  <h1>💗 Our Forever Song 💗</h1>
  <div class="names">Prithujit ❤️ Adrija</div>
  <div class="message">
    Every beat of this song holds<br>
    a piece of us — forever.
  </div>

  <audio id="song">
    <source src="https://drive.google.com/file/d/1FZMash_CbBW2ya-Ti1mKKIlvzqbkxOPM/view?usp=drivesdk" type="audio/mpeg">
  </audio>

  <div class="play-btn" onclick="togglePlay()">▶</div>

  <div class="date">Since the moment we became us ♾️</div>
  <div class="footer">Made with endless love</div>
</div>

<script>
const audio = document.getElementById("song");
const btn = document.querySelector(".play-btn");

function togglePlay() {
  if (audio.paused) {
    audio.play();
    btn.innerHTML = "⏸";
  } else {
    audio.pause();
    btn.innerHTML = "▶";
  }
}

// Floating hearts generator
setInterval(() => {
  const heart = document.createElement("div");
  heart.className = "heart";
  heart.innerHTML = "❤️";
  heart.style.left = Math.random() * 100 + "vw";
  heart.style.fontSize = (Math.random() * 10 + 15) + "px";
  heart.style.animationDuration = (Math.random() * 3 + 4) + "s";
  document.body.appendChild(heart);
  setTimeout(() => heart.remove(), 6000);
}, 700);
</script>

</body>
</html>
